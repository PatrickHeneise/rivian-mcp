name: Rivian OTA Monitor

on:
  schedule:
    - cron: '0 9 * * 1,3,5' # Mon, Wed, Fri 09:00 UTC
  workflow_dispatch:

jobs:
  check-ota:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check for new Rivian OTA updates
        uses: actions/github-script@v7
        with:
          script: |
            const S3_BASE = 'https://dc-service-prod-techpubs-r1-docs.s3.us-east-1.amazonaws.com'
            const FLOOR = { year: 2026, build: 7, sub: 0 }

            // Find highest version already reported via issues
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ota-update',
              state: 'all',
              per_page: 100,
            })

            let latest = { ...FLOOR }
            for (const issue of issues) {
              const m = issue.title.match(/(\d{4})\.(\d+)\.(\d+)/)
              if (m) {
                const [, y, b, s] = m.map(Number)
                if (y > latest.year || (y === latest.year && b > latest.build)) {
                  latest = { year: y, build: b, sub: s }
                }
              }
            }

            const latestStr = `${latest.year}.${String(latest.build).padStart(2, '0')}.${latest.sub}`
            core.info(`Latest known: ${latestStr} — checking ${latest.build + 1} through ${latest.build + 10}`)

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'ota-update',
              })
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'ota-update',
                color: '00a850',
                description: 'Rivian OTA software update',
              })
            }

            for (let b = latest.build + 1; b <= latest.build + 10; b++) {
              const vNum = `${latest.year}${String(b).padStart(2, '0')}${latest.sub}`
              const version = `${latest.year}.${String(b).padStart(2, '0')}.${latest.sub}`
              const pdfUrl = `${S3_BASE}/Vehicle/r1x_1_6/R1S/UpdateDetails/${vNum}/PDF-digital/US/en-US/update-details-${vNum}.pdf`

              core.info(`Checking ${version}...`)
              const res = await fetch(pdfUrl, { method: 'HEAD' })
              core.info(`  -> HTTP ${res.status}`)

              if (res.ok) {
                const alreadyReported = issues.some((i) => i.title.includes(version))
                if (!alreadyReported) {
                  const { data: newIssue } = await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `New Rivian OTA: v${version}`,
                    body: [
                      `## Rivian Software Update: ${version}`,
                      ``,
                      `**[Update Details PDF](${pdfUrl})**`,
                      ``,
                      `> Auto-detected by the OTA monitor workflow.`,
                    ].join('\n'),
                    labels: ['ota-update'],
                  })
                  core.info(`  Created issue #${newIssue.number}`)
                } else {
                  core.info(`  Issue already exists for ${version}, skipping`)
                }
              }
            }
